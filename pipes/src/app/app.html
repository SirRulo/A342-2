
<input type="text" [(ngModel)]="busqueda">

<table>
<thead>
  <th>Nombre</th>
  <th>Fecha de nacimiento</th>
  <th>País / Ciudad</th>
  <th>Foto</th>
  <th>Sueldo</th>

</thead>
<tbody>
  @for (user of users() | filtro: busqueda() ; track $index) {
    <tr>
      <td>{{ user | nombre | uppercase}}</td>
      <td>{{ user.dob.date | date: 'dd/MM/yyyy' : 'UTC' }}</td>
      <td>{{ user.location.country }} / {{ user.location.city }}</td>
      <td><img src="{{ user.picture.thumbnail }}" alt="Foto de {{ user.name.first }}"></td>
      <td>{{ 1000000 | currency }}</td>
    </tr>
  }

</tbody>
</table>
